
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador de Clicks | Colegio Bolívar</title>

    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>COLEGIO BOLÍVAR</h1>

        <p class="subtitle" id="tituloEvento">
            Contador de clicks para eventos
        </p>

        <label class="input-label" for="nuevoTitulo">
            Personaliza el título del evento
        </label>

        <input
            type="text"
            id="nuevoTitulo"
            class="title-input"
            placeholder="Escribe el nombre del evento..."
            value="Contador de clicks para eventos"
            maxlength="100"
        >

        <div id="contador" aria-live="polite" aria-atomic="true">0</div>

        <button id="clickButton" type="button">
            ¡Haz click!
        </button>

        <button id="resetButton" type="button">
            Reiniciar Contador
        </button>

        <p class="footer">
            CADA CLICK CUENTA<br>
            ¡PARTICIPA EN EL EVENTO!
        </p>
    </main>
</body>
</html>
