
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Speed Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Click Speed Challenge</h1>

        <div class="settings">
            <label for="duration">Selecciona la duración:</label>
            <select id="duration">
                <option value="10">10 segundos</option>
                <option value="20">20 segundos</option>
                <option value="30">30 segundos</option>
            </select>
        </div>

        <div class="timer" id="timer">00.000</div>

        <div class="counter">
            Clicks: <span id="clickCount">0</span>
        </div>

        <button id="clickButton" disabled>¡HAZ CLICK!</button>
        <button id="startButton">Iniciar partida</button>

        <div id="result"></div>

        <p class="instructions">
            Presiona iniciar y consigue la mayor cantidad de clicks
            antes de que termine el tiempo.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
